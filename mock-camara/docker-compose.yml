services:
  mock-camara:
    build:
      context: .
    container_name: mock-camara
    ports:
      - "${MOCK_CAMARA_PORT:-8090}:8090"
    environment:
      MOCK_CAMARA_PORT: "8090"
      CAMARA_API_KEY: "${CAMARA_API_KEY:-mock-secret-key-12345}"
      MOCK_FAILURE_RATE: "${MOCK_FAILURE_RATE:-0}"
      MOCK_LATENCY_MS: "${MOCK_LATENCY_MS:-0}"
    networks:
      - geodispatch-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
